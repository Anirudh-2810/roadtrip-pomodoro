<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Roadtrip Focus — Drive into deep work</title>
<script src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0,react-dom@18.2.0",
    "gsap": "https://esm.sh/gsap@3.12.5",
    "htm": "https://esm.sh/htm@3.1.1?external=react",
    "pixi.js": "https://esm.sh/pixi.js@7.4.2",
    "lottie-web": "https://esm.sh/lottie-web@5.12.2"
  }
}
</script>
<style>
  :root{--bg:#09090B;--surface:#121212;--surface2:#1a1a1e;--outline:rgba(255,255,255,0.08);--text:#e6f0e6;--muted:#7a8a7a;--accent:#10B981;--accent2:#059669;--r:14px;--fs-bg:#121212;--fs-road:#1a1a1a;--fs-neon:#10B981;--fs-mountain:#0d1a25;--fs-tree:#1e5b30;--fs-mileage:#ffffff;--fs-star:#ffffff;--fs-sky-top:#0a0e14;--fs-sky-horizon:#121820}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #root{height:100%;display:flex;flex-direction:column}
  header{padding:14px 16px 10px;text-align:center;position:relative}
  header h1{margin:0;font-size:19px;letter-spacing:1.4px;color:var(--accent);font-weight:800;text-shadow:0 0 12px rgba(16,185,129,0.45)}
  header p{margin:3px 0 0;color:var(--muted);font-size:11px;letter-spacing:0.3px}
  .phase{margin-top:6px;color:#9ab0a0;font-size:12px;font-weight:600}
  /* traffic removed — mac look without dots, header centered like Apple Music */
  .canvas-wrap{flex:1;position:relative;margin:12px 20px;background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid rgba(16,185,129,0.18);box-shadow:0 0 20px rgba(16,185,129,0.22), 0 24px 48px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06)}
  canvas{width:100%;height:100%;display:block}
  .hud{position:absolute;inset:0;pointer-events:none}
  .hud-card{position:absolute;background:rgba(15,20,25,0.88);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(30,42,51,0.9);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,0.45)}
  .hud-top{top:12px;left:50%;transform:translateX(-50%);min-width:520px;max-width:92%;justify-content:space-between}
  .hud-bottom{bottom:16px;left:50%;transform:translateX(-50%);min-width:640px;max-width:94%;justify-content:space-between;padding:10px 14px}
  /* YouTube-style fullscreen: map fills viewport */
  .canvas-wrap:fullscreen{margin:0;border-radius:0;border:none;box-shadow:none;width:100vw;height:100vh}
  .canvas-wrap:-webkit-full-screen{margin:0;border-radius:0;border:none;box-shadow:none;width:100vw;height:100vh}
  .canvas-wrap.fs-fallback{position:fixed;inset:0;z-index:9999;margin:0;border-radius:0;border:none;box-shadow:none;width:100vw;height:100vh}
  .canvas-wrap:fullscreen canvas,.canvas-wrap:-webkit-full-screen canvas,.canvas-wrap.fs-fallback canvas{height:100%}
  .is-fs-mode header,.is-fs-mode .intent,.is-fs-mode .route,.is-fs-mode .timer-row,.is-fs-mode .controls,.is-fs-mode .sound,.is-fs-mode .quick,.is-fs-mode .quote,.is-fs-mode .stats,.is-fs-mode .windowed-wrap{display:none !important}
  .fs-btn{display:none !important}
  /* windowed sheet + history (dark, Globetrans split) */
  .windowed-wrap{display:flex;gap:12px;margin:12px 20px;flex:1;min-height:0}
  .content-area{display:flex;gap:12px;flex:1;min-height:0}
  .sheet-wrap{flex:0 0 36%;min-width:300px;max-width:380px;background:var(--surface);border:1px solid var(--outline);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.35)}
  .sheet-head{padding:14px 14px 10px;border-bottom:1px solid var(--outline);display:flex;justify-content:space-between;align-items:center}
  .sheet-head h2{margin:0;font-size:13px;font-weight:800;color:var(--accent);letter-spacing:0.8px}
  .sheet-head span{color:var(--muted);font-size:11px;cursor:pointer}
  .sheet-tabs{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--outline)}
  .sheet-tab{flex:1;padding:6px 10px;border-radius:999px;border:1px solid var(--outline);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:background .15s, color .15s}
  .sheet-tab.active{background:var(--accent);color:#00140e;border-color:var(--accent);box-shadow:0 2px 8px rgba(16,185,129,0.25)}
  .sheet-intent{padding:10px 14px;border-bottom:1px solid var(--outline)}
  .sheet-intent label{color:var(--muted);font-weight:700;font-size:11px;display:block;margin-bottom:6px}
  .sheet-intent input{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px);color:var(--text);border-radius:10px;padding:7px 10px;outline:none;font-size:12px}
  .sheet-intent input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,0.22), 0 0 12px rgba(16,185,129,0.3)}
  .sheet-list{flex:1;overflow:auto;padding:8px 8px 0;min-height:160px}
  .sheet-row{padding:10px 10px;border:1px solid var(--outline);background:var(--surface2);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s, background .15s}
  .sheet-row:hover{border-color:rgba(0,230,154,0.35)}
  .sheet-row.active{border-color:var(--accent);background:rgba(0,230,154,0.08)}
  .sheet-row-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--text)}
  .sheet-row-sub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet-badge{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:0.4px;white-space:nowrap}
  .sheet-badge.transit{background:var(--accent);color:#00140e}
  .sheet-badge.delivered{background:var(--surface);color:var(--muted);border:1px solid var(--outline)}
  .sheet-empty{padding:28px 14px;text-align:center;color:var(--muted);font-style:italic;font-size:12px}
  .sheet-footer{padding:10px 14px;border-top:1px solid var(--outline);display:flex;flex-direction:column;gap:10px;background:var(--surface)}
  .sheet-footer .timer-row{margin:0}
  .sheet-footer .time-card{flex:0 0 140px}
  .sheet-footer .time{font-size:28px}
  .sheet-footer .controls{margin:0;justify-content:center}
  .sheet-footer .sound{margin:0}
  .sheet-footer .quick{margin:0}
  .sheet-footer .quote{margin:6px 0 0}
  .sheet-map-wrap{flex:1;position:relative;background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid rgba(16,185,129,0.18);box-shadow:0 0 20px rgba(16,185,129,0.15), 0 8px 24px rgba(0,0,0,0.35);min-height:420px;display:flex;flex-direction:column}
  .sheet-map-wrap .canvas-wrap{margin:0;flex:1;border:none;box-shadow:none;border-radius:0;height:auto}
  .sheet-detail{position:absolute;inset:8px;background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:12px;box-shadow:0 16px 32px rgba(0,0,0,0.45);z-index:5;display:flex;flex-direction:column;gap:8px}
  .sheet-detail h3{margin:0;font-size:13px;font-weight:800;color:var(--text)}
  .sheet-detail-bar{height:3px;background:var(--surface2);border-radius:999px;overflow:hidden}
  .sheet-detail-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
  .sheet-detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-size:11px}
  .sheet-detail-grid b{color:var(--text);display:block;font-size:11px}
  .sheet-detail-grid span{color:var(--muted);font-size:11px}
  @media(max-width:720px){.windowed-wrap{flex-direction:column}.content-area{flex-direction:column;margin:0 12px}.sheet-wrap{max-width:none;flex:0 0 auto;max-height:42vh}.sheet-map-wrap{min-height:42vh}}
  /* Apple Music / iOS glass — floating capsules (replaces YouTube bar) */
  .yt-wrap,.yt-top,.yt-bar,.yt-ctrl,.yt-time{display:none !important} /* legacy YouTube classes hidden */
  .am-dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:6}
  .am-dock.hidden{opacity:0;transform:translate(-50%,10px);pointer-events:none}
  .am-scrub-pill{pointer-events:none;width:min(520px,72vw);height:26px;padding:0 14px;background:rgba(28,30,34,0.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.10);border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;display:flex;align-items:center;position:relative;cursor:default;overflow:hidden}
  .am-scrub-pill .yt-track{position:relative;flex:1;height:3px;background:rgba(255,255,255,0.18);border-radius:999px;overflow:hidden}
  .am-scrub-pill .yt-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px;pointer-events:none;transition:width .25s ease}
  .am-scrub-pill .yt-thumb,.am-scrub-pill .yt-tip{display:none !important}
  .am-controls{position:absolute;right:16px;top:50%;transform:translateY(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 8px;background:rgba(28,30,34,0.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.10);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;z-index:6;transition:opacity .25s ease, transform .25s ease}
  .am-controls.hidden{opacity:0;transform:translate(12px,-50%);pointer-events:none}
  .am-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.08);color:var(--text);cursor:pointer;transition:background .15s, transform .12s, border-color .15s, box-shadow .15s;flex-shrink:0}
  .am-icon:hover{background:rgba(255,255,255,0.14);transform:scale(1.04);border-color:rgba(255,255,255,0.14)}
  .am-icon:active{transform:scale(0.96)}
  .am-icon.primary{width:44px;height:44px;background:var(--accent);border-color:var(--accent);color:#00140e;box-shadow:0 0 20px rgba(16,185,129,0.3), 0 4px 16px rgba(0,0,0,0.25)}
  .am-icon.small{width:36px;height:36px}
  .am-divider{width:20px;height:1px;background:rgba(255,255,255,0.08);margin:2px 0;flex-shrink:0}
  .am-time{font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;color:rgba(255,255,255,0.88);min-width:auto;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:0.2px;white-space:nowrap}
  .am-top{position:absolute;top:14px;left:50%;transform:translateX(-50%);pointer-events:none;transition:opacity .25s, transform .25s;z-index:6}
  .am-top.hidden{opacity:0;transform:translate(-50%,-6px);pointer-events:none}
  .am-top-pill{pointer-events:auto;background:rgba(28,30,34,0.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.10);border-radius:999px;padding:7px 14px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text);box-shadow:0 12px 40px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.06) inset;max-width:min(560px,92vw)}
  .am-top-pill b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
  .am-top-pill span{white-space:nowrap}
  .am-fs{position:absolute;right:14px;bottom:14px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(28,30,34,0.68);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.10);color:rgba(255,255,255,0.92);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,0.35);transition:background .15s, transform .12s}
  .am-fs:hover{background:rgba(255,255,255,0.14);transform:scale(1.05)}
  .am-fs:active{transform:scale(0.95)}
  .canvas-wrap:fullscreen .am-fs,.canvas-wrap:-webkit-full-screen .am-fs,.canvas-wrap.fs-fallback .am-fs{opacity:0;pointer-events:none}
  .log-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
  .log-card{width:min(640px,92vw);max-height:72vh;background:rgba(28,30,34,0.88);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,0.10);border-radius:16px;box-shadow:0 24px 48px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.06) inset;display:flex;flex-direction:column;overflow:hidden}
  .log-head{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center}
  .log-head h2{margin:0;font-size:14px;font-weight:800;color:var(--accent);letter-spacing:0.8px}
  .log-stats{font-size:11px;color:var(--muted)}
  .log-actions{display:flex;gap:8px}
  .log-body{flex:1;overflow:auto}
  .log-table{width:100%;border-collapse:collapse;font-size:12px}
  .log-table th{position:sticky;top:0;background:rgba(20,23,27,0.96);backdrop-filter:blur(12px);color:var(--muted);font-weight:700;font-size:10px;letter-spacing:0.6px;text-transform:uppercase;padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06);white-space:nowrap}
  .log-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:top}
  .log-table tr:hover td{background:rgba(255,255,255,0.04)}
  .log-intent{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .log-empty{padding:32px 16px;text-align:center;color:var(--muted);font-style:italic;font-size:13px}
  .log-foot{padding:10px 16px;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center}
  .log-foot button{padding:6px 12px;border-radius:8px;border:1px solid var(--outline);background:var(--surface);color:var(--text);cursor:pointer;font-size:12px;font-weight:700}
  .log-foot button.danger{background:rgba(204,51,51,0.12);border-color:rgba(204,51,51,0.3);color:#ff6b6b}
  .log-foot button.primary-log{background:var(--accent);color:#00140e;border-color:var(--accent)}
  @media(max-width:560px){.am-scrub-pill{width:78vw}.am-controls{gap:6px;padding:6px 8px}.am-time{min-width:78px;font-size:10.5px}.am-top-pill{padding:6px 10px;font-size:11px}.log-table{font-size:11px}.log-intent{max-width:160px}}
  .intent{margin:10px 20px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:10px 14px}
  .intent label{color:var(--muted);font-weight:700;font-size:12px;min-width:44px}
  .intent input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px);color:var(--text);border-radius:10px;padding:7px 10px;outline:none}
  .intent input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,0.22), 0 0 12px rgba(16,185,129,0.3)}
  .route{margin:0 20px 10px;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:10px 14px}
  .route select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px);color:var(--text);border-radius:8px;padding:6px 10px}
  .timer-row{display:flex;gap:12px;margin:10px 20px;align-items:stretch}
  .time-card{flex:0 0 240px;background:var(--surface);border:1px solid rgba(16,185,129,0.18);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-shadow:0 0 20px rgba(16,185,129,0.15), 0 4px 16px rgba(0,0,0,0.3)}
  .time{font-family:ui-monospace,Consolas,monospace;font-size:38px;font-weight:800;color:var(--accent);letter-spacing:1px;text-shadow:0 0 12px rgba(16,185,129,0.45)}
  .cap{color:var(--muted);font-size:11px;margin-top:2px}
  .progress-card{flex:1;background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:14px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative}
  .bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;border:1px solid var(--outline);position:relative}
  .fill{height:100%;background:linear-gradient(90deg, var(--accent), var(--accent2));width:0%;border-radius:999px;box-shadow:0 0 12px rgba(16,185,129,0.6), 0 0 20px rgba(16,185,129,0.3)}
  .pct{font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:0.2px}
  .controls{display:flex;gap:12px;justify-content:center;margin:14px 20px}
  .btn{padding:11px 18px;border-radius:12px;border:1px solid var(--outline);background:var(--surface);color:var(--text);cursor:pointer;font-weight:700;font-size:13px;transition:transform 0.12s}
  .btn:active{transform:scale(0.97)}
  .btn.primary{background:var(--accent);color:#00140e;border-color:var(--accent);box-shadow:0 0 20px rgba(16,185,129,0.3), 0 4px 12px rgba(0,0,0,0.25)}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .sound{display:flex;gap:10px;align-items:center;justify-content:center;margin:6px 20px;color:var(--muted);font-size:12px;background:var(--surface);border:1px solid var(--outline);border-radius:10px;padding:8px 12px}
  .sound select{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.10);backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px);color:var(--text);border-radius:6px;padding:4px 8px}
  .quick{display:flex;gap:8px;justify-content:center;margin:6px 20px 10px}
  .pill{padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--outline);color:var(--text);cursor:pointer;font-size:12px;font-weight:600}
  .pill.active{background:var(--accent);color:#00140e;border-color:var(--accent);box-shadow:0 2px 8px rgba(16,185,129,0.25)}
  .quote{text-align:center;color:var(--muted);font-style:italic;font-size:12px;margin:12px 20px 16px;opacity:0.9}
  .stats{display:flex;justify-content:space-between;align-items:center;margin:6px 14px 10px;color:var(--muted);font-size:11px}
  .stats button{padding:5px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--outline);color:var(--accent);cursor:pointer}
  .top-actions{position:absolute;top:12px;right:14px;display:flex;gap:8px}
  .top-actions button{padding:6px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--outline);color:var(--text);cursor:pointer;font-size:12px;font-weight:700}
  /* cover — Are you ready to hit the road? → Let's roll */
  .cover-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(7,10,14,0.78);backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px)}
  .cover-card{width:min(440px,92vw);background:rgba(15,20,25,0.96);border:1px solid rgba(30,42,51,0.92);border-radius:18px;padding:22px 20px 18px;box-shadow:0 24px 48px rgba(0,0,0,0.55),0 1px 0 rgba(255,255,255,0.06) inset;display:flex;flex-direction:column;gap:14px;text-align:center}
  .cover-eyebrow{color:var(--accent);font-size:11px;letter-spacing:1.2px;font-weight:800}
  .cover-title{font-size:22px;font-weight:800;color:var(--text);line-height:1.2;letter-spacing:0.2px}
  .cover-sub{color:var(--muted);font-size:13px;line-height:1.45}
  .cover-intent{text-align:left;background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:10px 12px}
  .cover-intent label{color:var(--muted);font-weight:700;font-size:11px;display:block;margin-bottom:6px}

  .cover-cta .btn{flex:1;max-width:280px;justify-content:center;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;font-size:14px}

<body>
<div id="root"></div>
<script type="module">
import React, {useEffect, useRef, useState, useMemo} from "react"
import {createRoot} from "react-dom/client"
import {motion, AnimatePresence} from "framer-motion"
import gsap from "gsap"
import htm from "htm"
import * as PIXI from "pixi.js"
import lottie from "lottie-web"
const html = htm.bind(React.createElement)

// --- Apple Music crisp SVG icons (inline, no dep, 1.5px hairline) ---
const IconPlay = ()=> html`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M4.2 2.8 L11.2 7 L4.2 11.2 Z" fill="currentColor" stroke="currentColor" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round"/></svg>`
const IconPause = ()=> html`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="3.2" y="2.6" width="2.6" height="8.8" rx="0.9" fill="currentColor"/><rect x="8.2" y="2.6" width="2.6" height="8.8" rx="0.9" fill="currentColor"/></svg>`
const IconReset = ()=> html`<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.2 8 A5.2 5.2 0 1 1 7.9 2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.2 2.9 V6.1 H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
const IconExit = ()=> html`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 5.4V2H5.4" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.6 2H12V5.4" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 8.6V12H8.6" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.4 12H2V8.6" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></svg>`
const IconExpand = ()=> html`<svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M5.2 2H2V5.2" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.8 2H12V5.2" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.8 12H12V8.8" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 8.8V12H5.2" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"/></svg>`

const ROUTES = [
  ["Coastal Hop",25,"Quick sprint — one focused stretch"],
  ["Desert Stretch",50,"Deep work block — stay with it"],
  ["Mountain Pass",90,"Long haul — settle in"],
  ["Cross-Country",120,"Marathon — the scenic way"],
]
const SCENERY_SPEED = 18

function useCurve(seed){
  return useMemo(()=>{
    let s = seed
    const rnd = ()=> (s = (s*16807)%2147483647, (s-1)/2147483646)
    return [42+rnd()*26, 14+rnd()*12, 0.028+rnd()*0.02, 0.11+rnd()*0.06, rnd()*6.28, rnd()*6.28]
  },[seed])
}

function App(){
  const [intent,setIntent]=useState("")
  const [routeName,setRouteName]=useState(ROUTES[0][0])
  const [routeMin,setRouteMin]=useState(ROUTES[0][1])
  const [remaining,setRemaining]=useState(ROUTES[0][1]*60)
  const [total,setTotal]=useState(ROUTES[0][1]*60)
  const [isRunning,setIsRunning]=useState(false)
  const [isPaused,setIsPaused]=useState(false)
  const [isFullscreen,setIsFullscreen]=useState(false)
  const [controlsVisible,setControlsVisible]=useState(true)
  const [seed,setSeed]=useState(Math.random())
  const [dist,setDist]=useState(0)
  const distRef=useRef(0)
  const distRenderRef=useRef(0)
  const displayDistRef=useRef(0)
  const lastUIDistRef=useRef(0)
  const [showDone,setShowDone]=useState(false)
  const [doneInfo,setDoneInfo]=useState(null)
  const [showLog,setShowLog]=useState(false)
  const [logRows,setLogRows]=useState([])
  const [noiseKind,setNoiseKind]=useState("brown")
  const [humOn,setHumOn]=useState(true)
  const [vol,setVol]=useState(0.12)
  const [sheetTab,setSheetTab]=useState("onroad")
  const [detailItem,setDetailItem]=useState(null)
  const [showCover,setShowCover]=useState(()=>{ try{ return !sessionStorage.getItem("rf_cover_dismissed")}catch{ return true }})
  const dismissCover=()=>{ try{ sessionStorage.setItem("rf_cover_dismissed","1")}catch{}; setShowCover(false) }
  // persistence — rf_state across refresh (P0)
  useEffect(()=>{
    try{
      const raw=localStorage.getItem("rf_state")
      if(!raw) return
      const s=JSON.parse(raw)
      if(Date.now() - (s.ts||0) > 24*3600*1000) return
      if(s.intent!=null) setIntent(s.intent)
      if(s.routeName) setRouteName(s.routeName)
      if(s.routeMin) setRouteMin(s.routeMin)
      if(s.total) setTotal(s.total)
      if(s.remaining!=null) setRemaining(s.remaining)
      if(s.vol!=null) setVol(s.vol)
      if(s.noiseKind) setNoiseKind(s.noiseKind)
      if(typeof s.humOn==="boolean") setHumOn(s.humOn)
      if(s.seed!=null) setSeed(s.seed)
      if(s.isRunning){ setIsRunning(true); if(s.isPaused) setIsPaused(true); startedAtRef.current = s.startedAt || new Date().toISOString(); t0Ref.current = performance.now() - ((s.total - (s.remaining||0))*1000) - (s.pausedRef||0); pausedRef.current = s.pausedRef||0; if(s.isPaused) pausedAt.current = performance.now() }
    }catch{}
  },[])
  useEffect(()=>{
    try{
      const data={ts:Date.now(), intent, routeName, routeMin, total, remaining, vol, noiseKind, humOn, seed, isRunning, isPaused, startedAt: startedAtRef.current, pausedRef: pausedRef.current}
      localStorage.setItem("rf_state", JSON.stringify(data))
    }catch{}
  },[intent, routeName, routeMin, total, remaining, vol, noiseKind, humOn, seed, isRunning, isPaused])
  useEffect(()=>{ if(!isRunning && !isPaused && remaining===total){ try{ localStorage.removeItem("rf_state") }catch{} } },[isRunning, isPaused, remaining, total])
  useEffect(()=>{ try{ if("Notification" in window && Notification.permission==="default") Notification.requestPermission() }catch{} },[])
  const prevKindRef=useRef(noiseKind)
  const prevHumRef=useRef(humOn)
  const canvasRef=useRef(null)
  const canvasWrapRef=useRef(null)
  const hideTimerRef=useRef(null)
  const audioRef=useRef(null)
  const isRunningRef=useRef(false)
  const isPausedRef=useRef(false)
  const idlePhaseRef=useRef(0)
  const pausedOffRef=useRef(0)
  const startedAtRef=useRef(null)
  const progress = total? (total-remaining)/total : 0
  const params=useCurve(seed)
  const roadCenter=(d)=> params[0]*Math.sin(d*params[2]+params[4]) + params[1]*Math.sin(d*params[3]+params[5])
  const persp=(t)=> 1 - Math.pow(1-t,1.65)

  // audio — seamless live swap while running (A)
  useEffect(()=>{
    let ctx, src, gain
    const init = ()=>{
      if(audioRef.current) return
      try{
        ctx = new (window.AudioContext||window.webkitAudioContext)()
        const bufferSize=ctx.sampleRate*4
        const buf=ctx.createBuffer(2, bufferSize, ctx.sampleRate)
        for(let ch=0; ch<2; ch++){
          const data=buf.getChannelData(ch)
          let b0,b1,b2,b3,b4,b5,b6
          b0=b1=b2=b3=b4=b5=b6=0
          let brown=0
          for(let i=0;i<bufferSize;i++){
            const white=Math.random()*2-1
            b0=0.99886*b0+white*0.0555179
            b1=0.99332*b1+white*0.0750759
            b2=0.96900*b2+white*0.153852
            b3=0.86650*b3+white*0.3104856
            b4=0.55000*b4+white*0.5329522
            b5=-0.7616*b5-white*0.016898
            const pink=(b0+b1+b2+b3+b4+b5+b6+white*0.5362)*0.11
            b6=white*0.115926
            brown = brown + white*0.02
            brown *= 0.998
            const kind=noiseKind
            let v = kind==="white"? white : kind==="pink"? pink : kind==="brown"? brown*3.5 : pink*0.8 + (Math.random()<0.002? (Math.random()*0.5):0)
            const t=i/ctx.sampleRate
            const drone = humOn? (0.35*Math.sin(2*Math.PI*55*t)+0.18*Math.sin(2*Math.PI*110*t))*0.6 : 0
            data[i]= (v*0.45 + drone*0.5) * vol * 0.9
          }
        }
        src=ctx.createBufferSource(); src.buffer=buf; src.loop=true
        gain=ctx.createGain(); gain.gain.value=1
        src.connect(gain).connect(ctx.destination)
        audioRef.current={ctx,src,gain}
      }catch(e){ console.log("audio fail",e) }
    }
    const start = ()=>{
      if(!audioRef.current) init()
      if(audioRef.current && audioRef.current.ctx.state==="suspended") audioRef.current.ctx.resume()
      try{ audioRef.current.src.start(0) }catch{}
    }
    const stop = ()=>{ try{ const a=audioRef.current; if(a){ a.src.stop(); try{a.ctx.close()}catch{} } audioRef.current=null }catch{} }
    const kindChanged = noiseKind!==prevKindRef.current
    const humChanged = humOn!==prevHumRef.current
    const needsRebuild = isRunning && !isPaused && audioRef.current && (kindChanged || humChanged)
    if(needsRebuild){
      stop()
      prevKindRef.current=noiseKind
      prevHumRef.current=humOn
    }
    // vol live without rebuild
    if(isRunning && !isPaused && audioRef.current && audioRef.current.gain){
      try{ audioRef.current.gain.gain.setValueAtTime(vol, audioRef.current.ctx.currentTime) }catch{}
      if(!kindChanged && !humChanged) return ()=>{}
    }
    if(isRunning && !isPaused && !audioRef.current){
      prevKindRef.current=noiseKind
      prevHumRef.current=humOn
    }
    if(isRunning && !isPaused){ start() } else { stop(); prevKindRef.current=noiseKind; prevHumRef.current=humOn }
    return ()=>{}
  },[isRunning,isPaused,noiseKind,humOn,vol])

  // timer + dist — unified RAF single clock (no setInterval drift, 120Hz safe)
  const t0Ref = React.useRef(performance.now())
  const pausedRef = React.useRef(0)
  const pausedAt = React.useRef(null)
  useEffect(()=>{
    if(isRunning && !isPaused){
      if(pausedAt.current) { pausedRef.current += performance.now() - pausedAt.current; pausedAt.current=null }
    } else if(isPaused){
      pausedAt.current = performance.now()
    }
  },[isPaused, isRunning])
  // desync intentional: 12% ease tail = end indication (88-100% coast to town, not lag)
  const easeOutCubic = t=> 1 - Math.pow(1 - t, 3)
  useEffect(()=>{
    let raf
    const tick=()=>{
      if(isRunning && !isPaused){
        const elapsed=(performance.now() - t0Ref.current - pausedRef.current)/1000
        const raw=Math.min(elapsed*SCENERY_SPEED*0.35, total*SCENERY_SPEED*0.35)
        const p=Math.min(elapsed/total, 1)
        const eased = p > 0.88 ? total*SCENERY_SPEED*0.35 * (0.88 + 0.12 * easeOutCubic((p - 0.88) / 0.12)) : raw
        distRef.current=eased
        distRenderRef.current += (distRef.current - distRenderRef.current)*0.14
        const now=performance.now()
        if(now - lastUIDistRef.current > 200){
          lastUIDistRef.current=now
          displayDistRef.current=distRenderRef.current
          setDist(displayDistRef.current)
        }
        const nextRemaining = Math.max(0, total - Math.floor(elapsed))
        if(nextRemaining !== remaining){
          if(nextRemaining <= 0){ setRemaining(0); setIsRunning(false); onFinish(); } else { setRemaining(nextRemaining) }
        } else if(elapsed >= total){
          if(remaining !== 0){ setRemaining(0); setIsRunning(false); onFinish() }
        }
      }
      raf=requestAnimationFrame(tick)
    }
    raf=requestAnimationFrame(tick)
    return ()=>cancelAnimationFrame(raf)
  },[isRunning, isPaused, total, remaining])
  // keep t0 in sync on start
  useEffect(()=>{
    if(isRunning && !isPaused){
      if(remaining===total) { t0Ref.current=performance.now(); pausedRef.current=0; distRef.current=0; distRenderRef.current=0; displayDistRef.current=0; lastUIDistRef.current=performance.now(); setDist(0) }
    }
  },[isRunning])
  // sync refs for draw loop (phase gate) — avoids stale closure on isRunning/isPaused
  useEffect(()=>{ isRunningRef.current=isRunning },[isRunning])
  useEffect(()=>{ 
    isPausedRef.current=isPaused
    if(isPaused){
      const pat=28 // 14+14 match dash+gap at dpr1
      pausedOffRef.current=(distRenderRef.current*0.18)%pat
    }
  },[isPaused])
  // sync isFullscreen — canvasWrap is the fullscreen element (YouTube style), not documentElement
  useEffect(()=>{
    const getFS = ()=> document.fullscreenElement || document.webkitFullscreenElement || null
    const handleChange = () => {
      const el = getFS()
      const wrap = canvasWrapRef.current
      // if we used fallback class, keep state true; otherwise match actual fullscreen element
      const isFS = wrap ? (el === wrap || wrap.classList.contains("fs-fallback")) : !!el
      setIsFullscreen(isFS)
      if(isFS) setControlsVisible(true)
    }
    handleChange()
    document.addEventListener("fullscreenchange", handleChange)
    document.addEventListener("webkitfullscreenchange", handleChange)
    return () => {
      document.removeEventListener("fullscreenchange", handleChange)
      document.removeEventListener("webkitfullscreenchange", handleChange)
    }
  }, [])

  // helpers: enter/exit fullscreen on canvasWrap
  const enterMapFullscreen = ()=>{
    const wrap = canvasWrapRef.current
    if(!wrap) return
    const req = wrap.requestFullscreen || wrap.webkitRequestFullscreen
    if(req){
      req.call(wrap).catch(()=>{
        // fallback to fixed-position fullscreen when API blocked (e.g. iOS, iframe)
        wrap.classList.add("fs-fallback")
        setIsFullscreen(true)
        setControlsVisible(true)
      })
    } else {
      wrap.classList.add("fs-fallback")
      setIsFullscreen(true)
      setControlsVisible(true)
    }
  }
  const exitMapFullscreen = ()=>{
    const wrap = canvasWrapRef.current
    if(wrap && wrap.classList.contains("fs-fallback")){
      wrap.classList.remove("fs-fallback")
      setIsFullscreen(false)
      return
    }
    const exit = document.exitFullscreen || document.webkitExitFullscreen
    if(document.fullscreenElement || document.webkitFullscreenElement) exit?.call(document).catch(()=>{})
    else setIsFullscreen(false)
  }

  // autohide controls after 3s idle (only when fullscreen + running + not paused) — read-only bar
  const resetHideTimer = ()=>{
    if(!isFullscreen) return
    setControlsVisible(true)
    if(hideTimerRef.current) clearTimeout(hideTimerRef.current)
    if(isRunning && !isPaused){
      hideTimerRef.current = setTimeout(()=> setControlsVisible(false), 3000)
    }
  }
  useEffect(()=>{
    if(isFullscreen && isRunning && !isPaused){
      resetHideTimer()
    } else if(isFullscreen){
      setControlsVisible(true)
      if(hideTimerRef.current) clearTimeout(hideTimerRef.current)
    }
    return ()=>{ if(hideTimerRef.current) clearTimeout(hideTimerRef.current) }
  },[isFullscreen, isRunning, isPaused])
  useEffect(()=>{
    const onKey = (e)=>{
      const tag = document.activeElement?.tagName
      const inInput = tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA"
      if(e.key==="Escape" && isFullscreen) { exitMapFullscreen(); return }
      if(inInput) return
      if(e.key==="f" || e.key==="F"){ e.preventDefault(); if(isFullscreen) exitMapFullscreen(); else enterMapFullscreen(); return }
      if(e.code==="Space" || e.key===" "){ e.preventDefault(); if(!isRunning) handleHitRoad(); else handlePauseToggle(); return }
      if(e.key==="r" || e.key==="R"){ e.preventDefault(); handleReset(); return }
      if(e.key==="m" || e.key==="M"){ e.preventDefault(); setHumOn(v=>!v); return }
    }
    document.addEventListener("keydown", onKey)
    return ()=> document.removeEventListener("keydown", onKey)
  },[isFullscreen, isRunning, isPaused, humOn])

  // scrubber: read-only display (no seek)

  // Trip Log helpers
  const loadLogs = ()=>{
    try{
      const arr=JSON.parse(localStorage.getItem("rf_sessions")||"[]")
      const rev=arr.slice().reverse()
      setLogRows(rev)
      return rev
    }catch{ setLogRows([]); return [] }
  }
  useEffect(()=>{ if(showLog) loadLogs() },[showLog])
  useEffect(()=>{ loadLogs() },[])
  const clearLogs = ()=>{
    if(!confirm("Clear all trip history?")) return
    localStorage.removeItem("rf_sessions")
    setLogRows([])
  }
  const deleteTransit = (finished_at)=>{
    if(!confirm("Delete this in-transit trip?")) return
    try{
      const arr=JSON.parse(localStorage.getItem("rf_sessions")||"[]")
      const nxt=arr.filter(r=> String(r.finished_at)!==String(finished_at))
      localStorage.setItem("rf_sessions", JSON.stringify(nxt))
      loadLogs()
      if(detailItem && String(detailItem.finished_at)===String(finished_at)) setDetailItem(null)
    }catch{}
  }
  const exportLogs = ()=>{
    const rows=logRows.length? logRows : JSON.parse(localStorage.getItem("rf_sessions")||"[]").slice().reverse()
    if(!rows.length) return
    const header="| Date | Route | Min | Intent | Done |\n|---|---|---|---|---|\n"
    const body=rows.map(r=>{
      const d=(r.finished_at||"").slice(0,16).replace("T"," ")
      const intent=(r.intent||"").replace(/\|/g,"/").slice(0,60)
      const done=r.completed?"✓":"—"
      return `| ${d} | ${r.route||""} | ${r.duration_min||0} | ${intent} | ${done} |`
    }).join("\n")
    const md=header+body+"\n"
    const blob=new Blob([md],{type:"text/markdown"})
    const url=URL.createObjectURL(blob)
    const a=document.createElement("a"); a.href=url; a.download=`roadtrip-log-${new Date().toISOString().slice(0,10)}.md`; a.click(); URL.revokeObjectURL(url)
  }

  // draw
  useEffect(()=>{
    const canvas=canvasRef.current
    if(!canvas) return
    const ctx=canvas.getContext("2d")
    let raf
    const draw=()=>{
      const dpr=window.devicePixelRatio||1
      const w=canvas.clientWidth*dpr, h=canvas.clientHeight*dpr
      if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h }
      const W=w,H=h, horizon=H*0.28, d=distRenderRef.current
      // idle drift only — cruise tied to dist, pause frozen
      let idlePhase = idlePhaseRef.current
      if(!isPausedRef.current && !isRunningRef.current){
        idlePhase=(idlePhase+0.016*0.02*SCENERY_SPEED)%1
        idlePhaseRef.current=idlePhase
      }
      ctx.clearRect(0,0,W,H)
      const grad=ctx.createLinearGradient(0,0,0,horizon)
      grad.addColorStop(0,"#060a0e"); grad.addColorStop(1,"#0e1e18")
      ctx.fillStyle=grad; ctx.fillRect(0,0,W,horizon)
      ctx.fillStyle="#a0a0a0"
      for(let sx=0;sx<W;sx+=47*dpr){
        const hsh=(sx*7+Math.floor(seed*1000))%255
        if(hsh<38){
          const tw=0.6+0.4*Math.sin(d*0.02+sx*0.013)
          if(tw>0.4){ const sy=(hsh%(horizon-8*dpr))+3*dpr; ctx.globalAlpha=0.6+0.4*tw; ctx.beginPath(); ctx.arc(sx,sy,1*dpr,0,Math.PI*2); ctx.fill() }
        }
      }
      ctx.globalAlpha=1
const hills=[
      ["#051510",0.22,420*dpr,22*dpr,0.018/dpr],["#0a201a",0.45,360*dpr,18*dpr,0.024/dpr],["#153025",0.85,300*dpr,14*dpr,0.032/dpr]
    ]
hills.forEach(([col,speed,tile,amp,freq])=>{
        const off=(-d*speed)%tile
        ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-tile+off-20*dpr, horizon)
        for(let x=-tile+off-20*dpr;x<W+tile+20*dpr;x+=10*dpr){
          const bump=amp*Math.sin((x+off*0.7)*freq)+amp*0.45*Math.sin((x+off*0.4)*freq*2.3+1.7)
          ctx.lineTo(x, horizon - Math.max(0,bump))
        }
        ctx.lineTo(W+tile+20*dpr,horizon); ctx.lineTo(-tile+off-20*dpr,horizon); ctx.closePath(); ctx.fill()
      })
      ctx.fillStyle="rgba(10,20,16,0.5)"; for(let i=0;i<6;i++) ctx.fillRect(0,horizon+i*2*dpr,W,2*dpr)
      ctx.strokeStyle="#1e2e28"; ctx.beginPath(); ctx.moveTo(0,horizon); ctx.lineTo(W,horizon); ctx.stroke()
      const n=18, visible=140, halfNear=260*dpr*(W/620), halfFar=42*dpr*(W/620)
      const centers=[], ys=[], halfs=[]
      for(let i=0;i<n;i++){
        const tlin=i/(n-1), pt=persp(tlin)
        const depth=(1-pt)*visible, wd=d+depth
        let cx=W/2 + roadCenter(wd)
        const maxOff= pt<0.15 ? W/2-halfFar-18*dpr : W/2-30*dpr
        cx=Math.max(W/2-maxOff, Math.min(W/2+maxOff, cx))
        centers.push(cx); ys.push(horizon*(1-pt)+H*pt); halfs.push(halfFar*(1-pt)+halfNear*pt)
      }
      ctx.fillStyle="#1a1a1a"; ctx.strokeStyle="#2a2a2a"; ctx.lineWidth=1*dpr

            <div class=${`am-top ${controlsVisible ? "" : "hidden"}`}>
              <div class="am-top-pill"><b>${intent||"No intent"}</b><span style=${{color:"var(--muted)",fontSize:"11px"}}>${routeName} · ${routeMin} min · ${(dist/42).toFixed(1)} km</span></div>
            </div>
            <div class=${`am-dock ${controlsVisible ? "" : "hidden"}`} onMouseMove=${resetHideTimer}>
              <div class="am-scrub-pill">
                <div class="yt-track"><div class="yt-fill" style=${{width:`${progress*100}%`}}></div></div>
              </div>
            </div>
            <div class=${`am-controls ${controlsVisible ? "" : "hidden"}`} onMouseMove=${resetHideTimer}>
                ${!isRunning
                  ? html`<button class="am-icon primary" aria-label="Hit the road" title="Hit the road" onClick=${handleHitRoad}><${IconPlay} /></button>`
                  : html`<button class="am-icon primary" aria-label=${isPaused ? "Resume" : "Pause"} title=${isPaused ? "Resume" : "Pause"} onClick=${handlePauseToggle}>${isPaused ? html`<${IconPlay} />` : html`<${IconPause} />`}</button>`}
                <button class="am-icon small" aria-label="Reset" title="Reset" onClick=${handleReset}><${IconReset} /></button>
                <div class="am-divider"></div>
                <span class="am-time">${timeLabel} · ${Math.round(progress*100)}%</span>
                <button class="am-icon small" aria-label="Exit fullscreen" title="Exit (Esc)" onClick=${exitMapFullscreen}><${IconExit} /></button>
            </div>
          </div>` : null}
        </div>
      </div>
      ${showLog ? html`<div class="log-overlay" onClick=${()=>setShowLog(false)}>
        <${motion.div} class="log-card" initial=${{y:16, opacity:0}} animate=${{y:0, opacity:1}} exit=${{y:16, opacity:0}} onClick=${e=>e.stopPropagation()}>
          <div class="log-head">
            <h2>Trip Log</h2>
            <div class="log-stats">${logRows.length} records · ${logRows.filter(r=>r.completed).length} completed · ${logRows.reduce((a,r)=>a+(r.duration_min||0),0)} min</div>
            <button onClick=${()=>setShowLog(false)} style=${{padding:"6px 10px",borderRadius:"8px",background:"var(--surface)",border:"1px solid var(--outline)",color:"var(--muted)",cursor:"pointer",fontSize:"12px"}}>Close</button>
          </div>
          <div class="log-body">
            ${logRows.length===0 ? html`<div class="log-empty">No trips yet — hit the road</div>` : html`<table class="log-table">
              <thead><tr><th>Finished</th><th>Route</th><th>Min</th><th>Intent</th><th>Done</th></tr></thead>
              <tbody>
                ${logRows.map(r=> html`<tr>
                  <td>${(r.finished_at||"").slice(0,16).replace("T"," ")}</td>
                  <td>${r.route||""}</td>
                  <td>${r.duration_min||0}</td>
                  <td class="log-intent" title=${r.intent||""}>${(r.intent||"").slice(0,48)}</td>
                  <td style=${{color: r.completed ? "var(--accent)" : "var(--muted)", fontWeight:700}}>${r.completed?"✓":"—"}${r.km?` · ${r.km}km`:""}</td>
                </tr>`)}
              </tbody>
            </table>`}
          </div>
          <div class="log-foot">
            <button class="danger" onClick=${clearLogs}>Clear log</button>
            <div style=${{display:"flex",gap:"8px"}}>
              <button onClick=${exportLogs}>Export .md</button>
              <button class="primary-log" onClick=${()=>setShowLog(false)}>Close</button>
            </div>
          </div>
        </motion.div>
      </div>` : null}
    </div>
  `
}
createRoot(document.getElementById("root")).render(React.createElement(App))
</script>
</body>
</html>
